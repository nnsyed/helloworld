name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Set up Java Environment (Adjust java-version if you use 8, 11, or 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches your Maven dependencies for faster builds

      # Step 3: Grant execute permission to the Maven wrapper script
      - name: Make maven wrapper executable
        run: chmod +x ./mvnw

      # Step 4: Run the Maven compile and build target
      - name: Build with Maven
        run: ./mvnw clean compile

      # Step 5: Run your Spring Boot unit and integration tests
      - name: Run Tests
        run: ./mvnw test

      # Step 6: Execute the deploy target
      - name: Deploy application
        run: ./mvnw deploy

